{% extends "base.html" %}

{% block title %}{{ note.title }}{% endblock %}

{% block content %}
  <h2>{{ note.title }}</h2>
  <pre>{{ note.content }}</pre>
  <p>
    <a href="{{ url_for('main.edit_note', note_id=note.id) }}">Edit</a> |
    <a href="{{ url_for('main.list_notes') }}">Back to List</a>
  </p>
{% endblock %}
